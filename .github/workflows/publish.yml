name: Publish

on:
  push:
    branches: [main]
    paths:
      - ".shipmail-source-revision"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sdk: ${{ steps.versions.outputs.sdk }}
      cli: ${{ steps.versions.outputs.cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find unpublished versions
        id: versions
        run: |
          for package in sdk:packages/shipmail cli:packages/shipmail-cli; do
            key="${package%%:*}"
            path="${package#*:}"
            name="$(node -p "require('./${path}/package.json').name")"
            version="$(node -p "require('./${path}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${key}=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${name}@${version} is already on npm."
            else
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            fi
          done

  publish:
    needs: check
    if: needs.check.outputs.sdk == 'true' || needs.check.outputs.cli == 'true'
    # npm trusted publishing does not support self-hosted runners.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Validate SDK package
        run: bun run lint:package

      - name: Publish SDK
        if: needs.check.outputs.sdk == 'true'
        run: cd packages/shipmail && npm publish --access public

      - name: Pin the CLI's SDK dependency for npm
        if: needs.check.outputs.cli == 'true'
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const sdk = JSON.parse(fs.readFileSync("packages/shipmail/package.json", "utf8"));
          const path = "packages/shipmail-cli/package.json";
          const cli = JSON.parse(fs.readFileSync(path, "utf8"));
          cli.dependencies.shipmail = sdk.version;
          fs.writeFileSync(path, `${JSON.stringify(cli, null, 2)}\n`);
          NODE

      - name: Publish CLI
        if: needs.check.outputs.cli == 'true'
        run: cd packages/shipmail-cli && npm publish --access public
